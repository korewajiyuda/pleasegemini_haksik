    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; }
        .tab-btn { transition: all 0.2s ease; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: 600; }
        .day-btn { transition: all 0.2s ease; }
        .day-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .card { transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }
        .heart-btn { transition: color 0.2s; }
        .heart-btn.liked { color: #ef4444; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Dice animation */
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>

                        { type: '중식 면 (3,000원)', name: '칼국수', desc: '490Kcal' },
                        { type: '석식', name: '닭갈비덮밥', desc: '무어묵국, 콩나물무침' }
                    ],
                    2: [
                        { type: '조식 (4,000원)', name: '소고기국밥', desc: '햄감자채볶음' },
                        { type: '중식 면 (3,000원)', name: '알리오올리오', desc: '570Kcal' },
                        { type: '석식', name: '갈비우거지탕', desc: '참나물무침' }
                    ],
                    3: [
                        { type: '조식 (4,000원)', name: '돈육불고기', desc: '콩나물김치국' },
                        { type: '중식(1) (4,000원)', name: '김치제육덮밥', desc: '계란국' },
                        { type: '중식 면 (3,000원)', name: '잔치국수', desc: '460Kcal' },
                        { type: '석식', name: '즐거운 명절 보내세요 🌕', desc: '금일 석식은 없습니다.' }
                    ],
                    4: [
                        { type: '추석 연휴', name: '즐거운 한가위 보내세요! 🌕', desc: '식당 운영을 하지 않습니다.' }
                    ],
                    5: [
                        { type: '추석 연휴', name: '즐거운 한가위 보내세요! 🌕', desc: '식당 운영을 하지 않습니다.' }
                    ]
                },
                'week5': { // 9월 5주차 (아직 없음)
                    1: [], 2: [], 3: [], 4: [], 5: []
                }
            }
        };

        // State variables
        let currentSchool = 'seoul';
        let currentWeek = 'week4';
        
        let currentDay = new Date().getDay();
        if (currentDay === 0 || currentDay === 6) currentDay = 1; // 주말이면 월요일
        // 데모 환경을 위해 현재 날짜 강제 고정 (9/24 목요일 기준)
        const today = new Date();
        if (today.getFullYear() === 2026 && today.getMonth() === 8 && today.getDate() === 24) {
            currentDay = 4;
        }

        // DOM Elements
        const tabs = document.querySelectorAll('.tab-btn');
        const dayBtns = document.querySelectorAll('.day-btn');
        const menuContainer = document.getElementById('menuContainer');
        const hufsToggle = document.getElementById('hufsToggle');
        
        // Navigation Elements
        const prevWeekBtn = document.getElementById('prevWeekBtn');
        const nextWeekBtn = document.getElementById('nextWeekBtn');
        const weekTitle = document.getElementById('weekTitle');
        
        // Random Modal Elements
        const randomBtn = document.getElementById('randomBtn');
        const randomModal = document.getElementById('randomModal');
        const randomModalContent = document.getElementById('randomModalContent');
        const closeModal = document.getElementById('closeModal');
        const randomResult = document.getElementById('randomResult');

        // Update Week UI (Title & Dates)
        function updateWeekUI() {
            weekTitle.innerText = weekSettings[currentWeek].title;
            const dates = weekSettings[currentWeek].dates;
            
            dayBtns.forEach(btn => {
                const dayNum = btn.dataset.day;
                btn.querySelector('.date-label').innerText = dates[dayNum];
            });

            // 화살표 활성화/비활성화 처리
            prevWeekBtn.style.opacity = currentWeek === 'week4' ? '0.3' : '1';
            nextWeekBtn.style.opacity = currentWeek === 'week5' ? '0.3' : '1';
        }

        // Render Menu Cards
        function renderMenu() {
            let data = menuData[currentSchool][currentWeek][currentDay];
            menuContainer.innerHTML = '';
            
            if (!data || data.length === 0) {
                menuContainer.innerHTML = `
                    <div class="card bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center mt-4">
                        <i class="fa-solid fa-calendar-xmark text-3xl text-gray-300 mb-2"></i>
                        <h3 class="text-gray-700 font-medium">식단 업데이트 대기 중</h3>
                        <p class="text-sm text-gray-500 mt-1">이 주의 식단표가 아직 올라오지 않았습니다.</p>
                    </div>`;
                return;
            }
            
            data.forEach((item, index) => {
                let typeColor = 'text-gray-500';
                let typeBg = 'bg-gray-100';
                if(item.type.includes('학생') || item.type.includes('중식')) { typeColor = 'text-blue-600'; typeBg = 'bg-blue-50'; }
                if(item.type.includes('교직') || item.type.includes('석식')) { typeColor = 'text-emerald-600'; typeBg = 'bg-emerald-50'; }
                if(item.type.includes('추석') || item.type.includes('조식')) { typeColor = 'text-purple-600'; typeBg = 'bg-purple-50'; }

                const isHoliday = item.type.includes('추석') || item.name.includes('명절');

                const cardHtml = `
                    <div class="card bg-white p-4 rounded-xl shadow-sm border border-gray-100 fade-in flex justify-between items-start" style="animation-delay: ${index * 0.05}s">
                        <div class="flex-1">
                            <span class="inline-block px-2 py-1 rounded text-[10px] font-bold ${typeBg} ${typeColor} mb-2">
                                ${item.type}
                            </span>
                            <h3 class="text-base font-bold text-gray-800 leading-tight mb-1 ${isHoliday ? 'text-purple-600' : ''}">${item.name}</h3>
                            <p class="text-xs text-gray-500 leading-snug">${item.desc}</p>
                        </div>
                        ${!isHoliday ? `
                        <button class="heart-btn text-gray-300 p-2 text-lg active:scale-125" onclick="this.classList.toggle('liked')">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                        ` : ''}
                    </div>
                `;
                menuContainer.innerHTML += cardHtml;
            });
        }

        // Navigation Listeners
        prevWeekBtn.addEventListener('click', () => {
            if(currentWeek === 'week5') {
                currentWeek = 'week4';
                updateWeekUI();
                renderMenu();
            }
        });

        nextWeekBtn.addEventListener('click', () => {
            if(currentWeek === 'week4') {
                currentWeek = 'week5';
                updateWeekUI();
                renderMenu();
            }
        });

        // Event Listeners for Tabs
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                tabs.forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                currentSchool = e.target.dataset.target;
                
                // Reset HUFS button state
                hufsToggle.innerHTML = '<span>👀 옆학교 외대는?</span>';
                hufsToggle.classList.remove('bg-rose-600');
                hufsToggle.classList.add('bg-indigo-600');
                
                renderMenu();
            });
        });

        // Event Listeners for Days
        dayBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const targetBtn = e.target.closest('.day-btn');
                dayBtns.forEach(b => b.classList.remove('active'));
                targetBtn.classList.add('active');
                currentDay = parseInt(targetBtn.dataset.day);
                renderMenu();
            });
        });

        // HUFS Toggle Listener
        hufsToggle.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            currentSchool = 'hufs';
            hufsToggle.innerHTML = '<span>🔙 경희대로 돌아가기</span>';
            hufsToggle.classList.remove('bg-indigo-600');
            hufsToggle.classList.add('bg-rose-600');
            renderMenu();
        });

        // Random Logic
        randomBtn.addEventListener('click', () => {
            const currentData = menuData[currentSchool][currentWeek][currentDay] || [];
            const validMeals = currentData.filter(item => !item.type.includes('추석') && !item.name.includes('명절'));
            
            randomBtn.classList.add('shake');
            setTimeout(() => randomBtn.classList.remove('shake'), 500);
            
            randomModal.classList.remove('hidden');
            setTimeout(() => {
                randomModalContent.classList.remove('scale-95', 'opacity-0');
                randomModalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            if (validMeals.length === 0) {
                randomResult.innerHTML = "해당 날짜에는 고를 수 있는 메뉴가 없어요! 😭";
                return;
            }

            let counter = 0;
            const shuffleInterval = setInterval(() => {
                const randomItem = validMeals[Math.floor(Math.random() * validMeals.length)];
                randomResult.innerHTML = randomItem.name;
                counter++;
                
                if (counter > 15) {
                    clearInterval(shuffleInterval);
                    const finalItem = validMeals[Math.floor(Math.random() * validMeals.length)];
                    randomResult.innerHTML = `🎉 ${finalItem.name} 🎉<br><span class="text-sm font-normal text-gray-500 mt-2 block">${finalItem.type}</span>`;
                }
            }, 50);
        });

        closeModal.addEventListener('click', () => {
            randomModalContent.classList.remove('scale-100', 'opacity-100');
            randomModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => randomModal.classList.add('hidden'), 200);
        });

        // Initialize
        updateWeekUI();
        document.querySelector(`.day-btn[data-day="${currentDay}"]`).classList.add('active');
        renderMenu();

    </script>
</body>
</html>
